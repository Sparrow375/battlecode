<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Node War // Esports Arena Broadcast</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="broadcast-body">
  <div class="stream-container">
    <!-- Top Esports Broadcast Scoreboard Header -->
    <header class="broadcast-header">
      <!-- Player 1 (Cyan Faction) -->
      <div class="team-card p1">
        <div class="team-badge">P1</div>
        <div class="team-details">
          <div class="team-name" id="p1-name">Rusher</div>
          <div class="team-stat-pills">
            <span class="pill gold" title="Gold Treasury">🪙 <strong id="p1-credits">30</strong></span>
            <span class="pill income" title="Gold Production / Turn">📈 <strong id="p1-income">+15</strong></span>
            <span class="pill upkeep" title="Empire Supply Tax">🛡️ <strong id="p1-upkeep">0</strong></span>
            <span class="pill nodes" title="Territories Owned">🏰 <strong id="p1-nodes">1</strong></span>
          </div>
        </div>
        <div class="team-score" id="p1-score">0</div>
      </div>

      <!-- Center Match Telemetry HUD -->
      <div class="center-hud">
        <div class="tournament-title">
          <span class="title-glow">NODE WAR</span> // ESPORTS ARENA
        </div>
        <div class="turn-display">TURN <span id="current-turn">1</span> / <span id="max-turn">120</span></div>
        <div class="relic-badge" id="relic-status">RELIC DORMANT (ACTIVATES TURN 80-100)</div>
        
        <div class="header-sub-controls">
          <div class="view-mode-toggle">
            <button class="view-btn active" data-mode="spectator" title="Audience Omniscient Perspective">Spectator</button>
            <button class="view-btn" data-mode="p1" title="Player 1 Fog-of-War">P1 Vision</button>
            <button class="view-btn" data-mode="p2" title="Player 2 Fog-of-War">P2 Vision</button>
          </div>
          <a href="setup.html" target="_blank" class="deck-link-btn" title="Open Organizer Match Setup & Controller Deck">⚙️ Setup Deck</a>
        </div>
      </div>

      <!-- Player 2 (Crimson Faction) -->
      <div class="team-card p2">
        <div class="team-score" id="p2-score">0</div>
        <div class="team-details text-right">
          <div class="team-name" id="p2-name">Turtle</div>
          <div class="team-stat-pills justify-right">
            <span class="pill nodes" title="Territories Owned">🏰 <strong id="p2-nodes">1</strong></span>
            <span class="pill upkeep" title="Empire Supply Tax">🛡️ <strong id="p2-upkeep">0</strong></span>
            <span class="pill income" title="Gold Production / Turn">📈 <strong id="p2-income">+15</strong></span>
            <span class="pill gold" title="Gold Treasury">🪙 <strong id="p2-credits">30</strong></span>
          </div>
        </div>
        <div class="team-badge">P2</div>
      </div>
    </header>

    <!-- Full-Bleed Battlefield Viewport -->
    <main class="stream-viewport-container" id="viewport-container">
      <!-- 1. Cartoon Tower Defense Canvas (Default) -->
      <canvas id="td-canvas" class="td-viewport"></canvas>

      <!-- 2. 3D Three.js WebGL Container -->
      <div id="three-container" class="three-viewport hidden"></div>

      <!-- 3. 2D Tactical Canvas -->
      <canvas id="game-canvas" class="hidden"></canvas>

      <!-- Dynamic Combat Flash Banner -->
      <div id="combat-banner" class="combat-banner hidden"></div>

      <!-- Top Overlay Controls (Engine Selector & Quick Navigation) -->
      <div class="viewport-overlay-top">
        <div class="engine-mode-pills">
          <button id="btn-mode-td" class="engine-btn active" title="Cartoon Tower Defense Game View">&#9876; Tower Defense</button>
          <button id="btn-mode-3d" class="engine-btn" title="3D Isometric Battlefield">&#9650; 3D Arena</button>
          <button id="btn-mode-2d" class="engine-btn" title="2D Tactical Schematic">&#9632; 2D Tactical</button>
        </div>
        <div class="quick-nav-pills">
          <button id="btn-jump-relic" class="quick-nav-btn" title="Jump to Relic Phase">&#9889; Relic</button>
          <button id="btn-jump-clash" class="quick-nav-btn" title="Jump to Next Battle">&#9876; Next Battle</button>
          <button id="btn-jump-end" class="quick-nav-btn" title="Jump to Match Finish">&#9209; Finish</button>
        </div>
      </div>

      <!-- 3D Camera Presets Overlay (Bottom-Left) -->
      <div class="camera-presets-overlay hidden" id="camera-presets-bar">
        <span class="cam-label">CAM:</span>
        <button class="cam-btn active" data-cam="iso" title="Isometric Overhead Angle">Isometric</button>
        <button class="cam-btn" data-cam="p1" title="Focus Player 1 Citadel">P1 Core</button>
        <button class="cam-btn" data-cam="relic" title="Focus Relic Sanctuary">Relic</button>
        <button class="cam-btn" data-cam="p2" title="Focus Player 2 Citadel">P2 Core</button>
        <button class="cam-btn" data-cam="cinematic" title="Spectator Orbit Flyby">&#9733; Orbit</button>
        <button class="cam-btn" data-cam="reset" title="Reset Camera View">&#8635;</button>
      </div>

      <!-- 2D Viewport Zoom & Pan Controls Overlay -->
      <div class="zoom-controls-overlay" id="zoom-controls-bar">
        <button id="btn-zoom-in" class="zoom-btn" title="Zoom In (+)">+</button>
        <span id="zoom-level-badge" class="zoom-badge">100%</span>
        <button id="btn-zoom-out" class="zoom-btn" title="Zoom Out (−)">−</button>
        <button id="btn-zoom-reset" class="zoom-btn" title="Reset View (100%)">&#8635;</button>
      </div>

      <!-- 3D Hover Tooltip -->
      <div id="three-tooltip" class="three-tooltip hidden"></div>
    </main>

    <!-- Redesigned Low-Profile Broadcast Bottom Ticker -->
    <footer class="broadcast-bottom-strip">
      <div class="strip-controls">
        <button id="btn-prev" class="stream-btn" title="Previous Turn (Left Arrow)">&#9664;&#9664;</button>
        <button id="btn-play" class="stream-btn stream-play-btn" title="Play / Pause (Spacebar)">&#9654;</button>
        <button id="btn-next" class="stream-btn" title="Next Turn (Right Arrow)">&#9654;&#9654;</button>
        <button id="btn-restart" class="stream-btn" title="Restart Match (R)">&#8634;</button>
      </div>

      <div class="stream-scrubber-box">
        <input type="range" id="timeline-scrubber" min="1" max="120" value="1" class="stream-scrubber">
        <div class="stream-scrubber-labels">
          <span class="scrub-label left">T1</span>
          <span class="scrub-label relic" id="scrubber-relic-marker">⚡ Relic Awakening</span>
          <span class="scrub-label right" id="scrubber-end-marker">T120</span>
        </div>
      </div>

      <div class="stream-speed-box">
        <button class="speed-btn" data-speed="1500">0.5x</button>
        <button class="speed-btn active" data-speed="1000">1x</button>
        <button class="speed-btn" data-speed="500">2x</button>
        <button class="speed-btn" data-speed="250">4x</button>
        <button class="speed-btn" data-speed="50">Max</button>
      </div>

      <div class="stream-action-box">
        <button id="btn-fullscreen" class="stream-btn fullscreen-btn" title="Toggle Fullscreen Projector Mode (F)">⛶ Fullscreen</button>
      </div>
    </footer>
  </div>

  <!-- Three.js 3D Engine & Controls (Vendor) -->
  <script src="vendor/three.min.js"></script>
  <script src="vendor/OrbitControls.js"></script>
  <script src="three_visualizer.js"></script>
  <!-- Cartoon Tower Defense Game Visualizer -->
  <script src="td_visualizer.js"></script>
  <script src="visualizer.js"></script>
</body>
</html>
